name: Windows calendar acceptance

# Bounded #54 acceptance run. Broader DST/leap-month/configuration fixtures remain open.
on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/windows-calendar.yml'
      - 'scripts/ci/windows-calendar.ts'
      - 'scripts/ci/windows-vitest.config.ts'
      - 'package-lock.json'
      - 'vitest.config.ts'

permissions:
  contents: read

jobs:
  windows-calendar:
    name: Native Windows focused regression
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EVENT_SHA: ${{ github.sha }}
      NO_COLOR: '1'
    steps:
      - name: Checkout exact PR head in an encoded path
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: 'checkout 空間 # %'
          persist-credentials: false

      - name: Setup pinned Node without cache
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Install exact locked dependencies without lifecycle scripts
        id: install
        working-directory: 'checkout 空間 # %'
        run: npm ci --ignore-scripts

      - name: Verify controls and all six migrated suites
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        working-directory: 'checkout 空間 # %'
        env:
          NPM_CI_OUTCOME: ${{ steps.install.outcome }}
        run: |
          node scripts/ci/windows-calendar.ts
          exit $LASTEXITCODE

      - name: Always print acceptance evidence and unrun stages
        if: ${{ always() }}
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'fortune-windows-calendar.json'
          $stages = @(
            'native-runtime', 'source-provenance', 'frozen-install',
            'tz:UTC', 'tz:Asia/Taipei', 'tz:America/New_York', 'tz:Pacific/Apia', 'path-controls',
            'suite:baziNatalBasis', 'suite:calculationSpec', 'suite:calendarHostTimezone',
            'suite:dateOnlyCalendar', 'suite:ziweiAsOfTimezone', 'suite:subprocessModuleUrl',
            'source-unchanged', 'aggregate'
          )
          $evidence = $null
          if (Test-Path -LiteralPath $path) {
            try {
              $raw = Get-Content -LiteralPath $path -Raw
              Write-Output $raw
              $evidence = $raw | ConvertFrom-Json -AsHashtable -ErrorAction Stop
            } catch {
              Write-Output 'Evidence file is incomplete or unreadable; unproven stages are NOT RUN.'
            }
          }
          foreach ($name in $stages) {
            $status = if ($null -ne $evidence -and $evidence.stages.ContainsKey($name)) { $evidence.stages[$name].status } else { 'NOT RUN' }
            if ($status -eq 'RUNNING') { $status = 'INCOMPLETE' }
            Write-Output "${name}: ${status}"
          }
          Write-Output 'Focused Windows evidence only. Full repository Windows test/build and broader #54 fixtures are not established.'
