name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Classify and inventory
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - id: plan
        run: bun scripts/ci/pipeline.ts plan

  regression:
    name: Full regression ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun scripts/ci/pipeline.ts run ${{ matrix.shard }}

  lightweight:
    name: Scoped documentation and asset regression
    needs: plan
    if: needs.plan.outputs.mode == 'docs' || needs.plan.outputs.mode == 'assets'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun scripts/ci/pipeline.ts run lightweight

  checks:
    name: Typecheck, doctor and build
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - name: Typecheck CI controls
        run: bun run --cwd apps/web --bun tsc -p ../../scripts/ci/tsconfig.json
      - name: Typecheck core
        run: bun run --filter @fortune/core typecheck
      - name: Typecheck web app
        run: bun run --filter @fortune/web typecheck
      - name: Typecheck AI package
        run: bun run --filter @fortune/ai typecheck
      - name: Typecheck MCP package
        run: bun run --filter @fortune/mcp typecheck
      - name: Doctor（MCP 冒煙測試）
        run: bun run packages/mcp/src/cli/doctor.ts --ci
      - name: Build
        run: bun run build
      - name: Verify built public assets and PWA precache
        run: bun scripts/ci/assets.ts

  test:
    # Preserve the existing required-check display name. Only intentionally
    # excluded lanes may be skipped; missing, cancelled or failed work fails.
    name: Test & Build
    needs: [plan, regression, lightweight, checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      accepted_sha: ${{ steps.aggregate.outputs.accepted_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - id: aggregate
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          RESULTS: '{"plan":"${{ needs.plan.result }}","regression":"${{ needs.regression.result }}","lightweight":"${{ needs.lightweight.result }}","checks":"${{ needs.checks.result }}"}'
        run: bun scripts/ci/pipeline.ts aggregate

  publish:
    name: Publish accepted master
    needs: test
    if: ${{ !cancelled() && github.repository == 'skydreamer0/fortunetelling' && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.test.result == 'success' }}
    # Existing Pages scopes relocated only to this trusted post-acceptance job.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      accepted_sha: ${{ needs.test.outputs.accepted_sha }}
      acceptance_result: ${{ needs.test.result }}
